{% extends 'base.html' %}{% block content %}<div class="page-head"><div><div class="eyebrow">EVENT PLANNING</div><h1>Timeline</h1><p class="muted">{{event.first_name}} & {{event.last_name}} · {{event.event_date}}</p></div><a class="button" href="{{url_for('event_day_mode',eid=event.id)}}">Event-Day Mode</a></div><div class="panel"><div class="panel-head"><h2>Wedding timeline</h2><span class="muted">Edit each moment as details are confirmed.</span></div>{% for i in items %}<form class="timeline-card" method="post" action="{{url_for('update_timeline_item',eid=event.id,item_id=i.id)}}"><div class="timeline-num">{{loop.index}}</div><div class="timeline-main"><div class="form-grid"><label>Moment<input name="title" value="{{i.title}}"></label><label>Time<input type="time" name="start_time" value="{{i.start_time or ''}}"></label><label>Duration (min)<input type="number" name="duration" value="{{i.duration or ''}}"></label><label>Person responsible<input name="person_responsible" value="{{i.person_responsible or ''}}"></label></div><div class="form-grid"><label>Description<textarea name="description">{{i.description or ''}}</textarea></label><label>Music<input name="music" value="{{i.music or ''}}"></label><label>MC notes<textarea name="mc_notes">{{i.mc_notes or ''}}</textarea></label><label>Special instructions<textarea name="special_instructions">{{i.special_instructions or ''}}</textarea></label></div><div class="row-actions"><button class="button" type="submit">Save</button><button class="button danger" formmethod="post" formaction="{{url_for('delete_timeline_item',eid=event.id,item_id=i.id)}}">Delete</button></div></div></form>{% endfor %}</div><div class="panel"><h2>Add timeline item</h2><form method="post" class="form-grid"><label>Moment<input name="title" required></label><label>Time<input type="time" name="start_time"></label><label>Duration<input type="number" name="duration"></label><label>Person responsible<input name="person_responsible"></label><label>Description<textarea name="description"></textarea></label><label>Music<input name="music"></label><label>MC notes<textarea name="mc_notes"></textarea></label><label>Special instructions<textarea name="special_instructions"></textarea></label><div><button class="button" type="submit">Add to timeline</button></div></form></div>{% endblock %}
