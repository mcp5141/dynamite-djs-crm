{% extends 'base.html' %}{% block content %}<div class="page-head"><div><div class="eyebrow">CONTRACT {{ct.id}}</div><h1>{{ct.first_name}} & {{ct.last_name}}</h1><p class="muted">{{ct.event_date}} · {{ct.name}}</p></div></div><form method="post" class="panel narrow"><div class="fields two"><label>Status<select name="status">{% for x in ['Created','Sent','Viewed','Signed','Declined','Expired'] %}<option {% if x==ct.status %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>Expiration date<input type="date" name="expires_at" value="{{ct.expires_at or ''}}"></label></div><label>Content<textarea name="content" rows="20">{{ct.content or ''}}</textarea></label><div class="detail-list"><div><span>Sent</span><b>{{ct.sent_at or '—'}}</b></div><div><span>Signed</span><b>{{ct.signed_at or '—'}}</b></div></div><button class="btn primary">Save Contract</button></form>{% endblock %}
