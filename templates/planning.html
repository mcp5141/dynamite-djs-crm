{% extends 'base.html' %}{% block content %}<div class="page-head"><div><div class="eyebrow">EVENT PLANNING</div><h1>Ceremony & Reception</h1><p class="muted">{{event.first_name}} & {{event.last_name}}</p></div></div><form method="post"><div class="grid two"><div class="panel"><h2>Schedule</h2><div class="form-grid"><label>Ceremony location<input name="ceremony_location" value="{{planning.ceremony_location if planning else ''}}"></label><label>Ceremony time<input type="time" name="ceremony_time" value="{{planning.ceremony_time if planning else ''}}"></label><label>Cocktail time<input type="time" name="cocktail_time" value="{{planning.cocktail_time if planning else ''}}"></label><label>Reception time<input type="time" name="reception_time" value="{{planning.reception_time if planning else ''}}"></label><label>Guest arrival<input type="time" name="guest_arrival_time" value="{{planning.guest_arrival_time if planning else ''}}"></label><label>Grand entrance<input type="time" name="grand_entrance_time" value="{{planning.grand_entrance_time if planning else ''}}"></label></div></div><div class="panel"><h2>Special dances</h2><div class="form-grid"><label>First dance<textarea name="first_dance">{{planning.first_dance if planning else ''}}</textarea></label><label>Parent dances<textarea name="parent_dances">{{planning.parent_dances if planning else ''}}</textarea></label><label>Announcements<textarea name="announcements">{{planning.announcements if planning else ''}}</textarea></label><label>Traditions<textarea name="traditions">{{planning.traditions if planning else ''}}</textarea></label></div></div></div><div class="grid two"><div class="panel"><h2>People & vendors</h2><div class="form-grid"><label>Day-of contact<textarea name="day_of_contact">{{planning.day_of_contact if planning else ''}}</textarea></label><label>Emergency contact<textarea name="emergency_contact">{{planning.emergency_contact if planning else ''}}</textarea></label><label>Vendor info<textarea name="vendor_info">{{planning.vendor_info if planning else ''}}</textarea></label><label>Preferred genres<textarea name="genres">{{planning.genres if planning else ''}}</textarea></label></div></div><div class="panel"><h2>Notes</h2><div class="form-grid"><label>Ceremony notes<textarea name="ceremony_notes">{{planning.ceremony_notes if planning else ''}}</textarea></label><label>Reception notes<textarea name="reception_notes">{{planning.reception_notes if planning else ''}}</textarea></label><label>Special instructions<textarea name="special_instructions">{{planning.special_instructions if planning else ''}}</textarea></label></div></div></div><button class="button" type="submit">Save planning information</button></form>{% endblock %}
