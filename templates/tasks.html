{% extends 'base.html' %}{% block content %}<div class="page-head"><div><div class="eyebrow">ACTION CENTER</div><h1>Tasks</h1><p class="muted">Keep the next action visible.</p></div></div><div class="grid two"><form method="post" class="panel"><h2>New task</h2><label>Task<input name="title" required placeholder="Follow up with couple"></label><label>Due date<input type="date" name="due_date" value="{{today}}" required></label><label>Priority<select name="priority">{% for p in priorities %}<option>{{p}}</option>{% endfor %}</select></label><label>Assigned to<select name="assigned_user_id"><option value="">Unassigned</option>{% for u in users %}<option value="{{u.id}}">{{u.name}}</option>{% endfor %}</select></label><label>Type<input name="task_type" placeholder="Follow-up"></label><label>Notes<textarea name="notes"></textarea></label><button class="btn primary">Create task</button></form><section class="panel"><div class="panel-head"><h2>Task queue</h2></div>{% for t in rows %}<div class="task-row"><form method="post" action="{{url_for('toggle_task',tid=t.id)}}"><button class="check">{{'✓' if t.status=='Done' else ''}}</button></form><div class="grow"><strong class="{{'done' if t.status=='Done'}}">{{t.title}}</strong><span>{{t.due_date}} · {{t.priority}} · {{t.assignee or 'Unassigned'}}</span></div></div>{% else %}<div class="empty">No tasks.</div>{% endfor %}</section></div>{% endblock %}
