{% extends 'base.html' %}{% block content %}<div class="page-head"><div><div class="eyebrow">LEAD</div><h1>{{'Edit lead' if lead else 'New lead'}}</h1></div><a class="btn" href="{{url_for('leads')}}">Back to leads</a></div><form method="post" class="form-grid"><section class="panel span2"><h2>Contact</h2><div class="fields two"><label>First name<input name="first_name" value="{{lead.first_name if lead else ''}}" required></label><label>Last name<input name="last_name" value="{{lead.last_name if lead else ''}}" required></label><label>Partner name<input name="partner_name" value="{{lead.partner_name if lead else ''}}"></label><label>Email<input type="email" name="email" value="{{lead.email if lead else ''}}"></label><label>Phone<input name="phone" value="{{lead.phone if lead else ''}}"></label><label>Event type<input name="event_type" value="{{lead.event_type if lead else 'Wedding'}}"></label></div></section><section class="panel"><h2>Event</h2><label>Event date<input type="date" name="event_date" value="{{lead.event_date if lead else ''}}"></label><label>Venue<input name="venue" value="{{lead.venue if lead else ''}}"></label><label>Guest count<input type="number" name="guest_count" value="{{lead.guest_count if lead else ''}}"></label><label>Estimated budget<input type="number" step="0.01" name="budget" value="{{lead.budget if lead else ''}}"></label></section><section class="panel"><h2>Pipeline</h2><label>Status<select name="status">{% for s in ['New Inquiry','Contacted','Consultation Scheduled','Consultation Completed','Proposal Sent','Follow-Up','Booked','Lost','Not Qualified'] %}<option {{'selected' if lead and lead.status==s}}>{{s}}</option>{% endfor %}</select></label><label>Package<select name="package"><option value="">Not selected</option>{% for p in packages %}<option {{'selected' if lead and lead.package==p}}>{{p}}</option>{% endfor %}</select></label><label>Source<select name="source"><option value="">Select</option>{% for s in sources %}<option {{'selected' if lead and lead.source==s}}>{{s}}</option>{% endfor %}</select></label><label>Assigned to<select name="assigned_user_id"><option value="">Unassigned</option>{% for u in users %}<option value="{{u.id}}" {{'selected' if lead and lead.assigned_user_id==u.id}}>{{u.name}}</option>{% endfor %}</select></label></section><section class="panel span2"><h2>Follow-up & notes</h2><div class="fields two"><label>Consultation date<input type="datetime-local" name="consultation_date" value="{{lead.consultation_date if lead else ''}}"></label><label>Next follow-up<input type="date" name="next_follow_up" value="{{lead.next_follow_up if lead else ''}}"></label><label>Last contacted<input type="datetime-local" name="last_contacted" value="{{lead.last_contacted if lead else ''}}"></label><label>Lost reason<input name="lost_reason" value="{{lead.lost_reason if lead else ''}}"></label></div><label>Internal notes<textarea name="notes">{{lead.notes if lead else ''}}</textarea></label></section><div class="form-actions span2"><a class="btn" href="{{url_for('leads')}}">Cancel</a><button class="btn primary">{{'Save changes' if lead else 'Create lead'}}</button></div></form>{% endblock %}
