{% extends 'base.html' %}{% block content %}<div class="page-head"><div><div class="eyebrow">ADMIN</div><h1>Settings</h1><p>Business-level deployment and public URL settings.</p></div></div><form method="post" class="card form-grid"><label class="full-row">Public CRM URL<input name="setting_PUBLIC_BASE_URL" placeholder="https://crm.yourdomain.com" value="{{vals.get('PUBLIC_BASE_URL','')}}"><small>Use the final HTTPS address once hosting is live.</small></label><label>Company name<input name="setting_COMPANY_NAME" value="{{vals.get('COMPANY_NAME','Dynamite DJs')}}"></label><label>Company email<input name="setting_COMPANY_EMAIL" value="{{vals.get('COMPANY_EMAIL','')}}"></label><label>Review URL<input name="setting_REVIEW_URL" value="{{vals.get('REVIEW_URL','')}}"></label><div class="full-row"><button class="btn primary">Save settings</button></div></form>{% endblock %}
