{% extends 'base.html' %}{% block content %}<div class="page-head"><div><div class="eyebrow">CATALOG</div><h1>Packages</h1><p class="muted">Current Dynamite DJs package foundation.</p></div></div><div class="package-grid">{% for p in rows %}<div class="package-card {% if p.name=='Platinum' %}featured{% endif %}"><span class="package-name">{{p.name}}</span><div class="price">${{('%0.0f'|format(p.price))}}</div><p>{{p.desc}}</p>{% if p.name=='Platinum' %}<span class="popular">MOST POPULAR</span>{% endif %}</div>{% endfor %}</div>{% endblock %}
