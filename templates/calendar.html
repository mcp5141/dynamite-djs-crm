{% extends 'base.html' %}{% block content %}<div class="page-head"><div><div class="eyebrow">SCHEDULE</div><h1>Calendar</h1><p class="muted">Phase 1 event agenda.</p></div></div><div class="calendar-list">{% for e in rows %}<a class="calendar-item" href="{{url_for('event_detail',eid=e.id)}}"><div class="cal-date">{{e.event_date}}</div><div><strong>{{e.first_name}} & {{e.last_name}}</strong><span>{{e.venue or 'Venue TBD'}} · {{e.event_type}}</span></div><span class="pill">{{e.package or 'Package TBD'}}</span></a>{% else %}<div class="panel empty">No events yet.</div>{% endfor %}</div>{% endblock %}
