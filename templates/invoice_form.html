{% extends 'base.html' %}{% block content %}<div class="page-head"><div><div class="eyebrow">INVOICE · {{event.first_name}} {{event.last_name}}</div><h1>New Invoice</h1><p class="muted">Create an invoice from the latest quote or event total.</p></div></div><form method="post" class="panel narrow"><div class="fields two"><label>Invoice number<input name="invoice_number" placeholder="Auto-generated if blank"></label><label>Total<input name="total" type="number" step=".01" value="{{'%.2f'|format(quote.total if quote else event.total or 0)}}"></label><label>Due date<input name="due_date" type="date"></label><label>Status<select name="status"><option>Due</option><option>Paid</option><option>Partial</option><option>Overdue</option></select></label></div><div class="form-actions"><a class="btn" href="{{url_for('event_detail',eid=event.id)}}">Cancel</a><button class="btn primary">Create Invoice</button></div></form>{% endblock %}
