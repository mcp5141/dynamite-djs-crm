{% extends 'base.html' %}{% block content %}<div class="page-head"><div><div class="eyebrow">NEW QUOTE · EVENT {{event.id}}</div><h1>{{event.event_name or event.event_date}}</h1><p class="muted">{{event.venue or 'Venue TBD'}}</p></div></div><form method="post" class="panel narrow"><div class="fields two"><label>Package<select name="package" id="pkg">{% for p in packages %}<option value="{{p}}" data-price="{{prices[p]}}" {% if p==event.package %}selected{% endif %}>{{p}} — ${{prices[p]}}</option>{% endfor %}</select></label><label>Retainer<input name="retainer" type="number" step="0.01" value="250"></label><label>Discount<input name="discount" type="number" step="0.01" value="0"></label><label>Tax<input name="tax" type="number" step="0.01" value="0"></label></div><h2>Add-ons</h2><div class="addon-grid">{% for a in addons %}<label class="addon"><input type="checkbox" name="addons" value="{{a.id}}" data-price="{{a.price}}"><span><strong>{{a.name}}</strong><small>${{a.price}} · {{a.description}}</small></span></label>{% endfor %}</div><label>Notes<textarea name="notes" placeholder="Proposal notes, scope, special terms…"></textarea></label><div class="quote-total"><span>Estimated total</span><strong id="total">$0</strong></div><div class="form-actions"><a class="btn" href="{{url_for('event_detail',eid=event.id)}}">Cancel</a><button class="btn primary">Create quote</button></div></form><script>function calc(){let p=+document.querySelector('#pkg option:checked').dataset.price;document.querySelectorAll('input[name=addons]:checked').forEach(x=>p+=+x.dataset.price);p-=+(document.querySelector('[name=discount]').value||0);p+=+(document.querySelector('[name=tax]').value||0);document.querySelector('#total').textContent='$'+p.toFixed(2)}document.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',calc));calc()</script>{% endblock %}
