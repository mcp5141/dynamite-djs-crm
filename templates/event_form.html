{% extends 'base.html' %}{% block content %}<div class="page-head"><div><div class="eyebrow">BOOKING</div><h1>New event</h1></div></div><form method="post" class="form-grid"><section class="panel"><h2>Client</h2><label>Client<select name="client_id" required>{% for c in clients %}<option value="{{c.id}}">{{c.first_name}} {{c.last_name}}{% if c.partner_name %} & {{c.partner_name}}{% endif %}</option>{% endfor %}</select></label><label>Event name<input name="event_name" placeholder="Erica & Todd Wedding"></label><label>Event type<input name="event_type" value="Wedding"></label></section><section class="panel"><h2>Event details</h2><label>Event date<input type="date" name="event_date" required></label><label>Venue<input name="venue"></label><label>Venue address<input name="venue_address"></label><label>Guest count<input type="number" name="guest_count"></label></section><section class="panel"><h2>Package & assignment</h2><label>Package<select id="package" name="package" onchange="document.getElementById('total').value=this.options[this.selectedIndex].dataset.price">{% for p in packages %}<option data-price="{{prices[p]}}">{{p}}</option>{% endfor %}</select></label><label>Total<input id="total" type="number" step="0.01" name="total" value="2400"></label><label>Paid<input type="number" step="0.01" name="paid" value="0"></label><label>Assigned DJ<select name="assigned_user_id"><option value="">Unassigned</option>{% for u in users %}<option value="{{u.id}}">{{u.name}}</option>{% endfor %}</select></label></section><section class="panel"><h2>Planning</h2><label>Status<select name="planning_status"><option>Planning</option><option>Final Confirmation</option><option>Event Day</option><option>Completed</option></select></label><label>Notes<textarea name="notes"></textarea></label></section><div class="form-actions span2"><a class="btn" href="{{url_for('events')}}">Cancel</a><button class="btn primary">Create event</button></div></form>{% endblock %}
